<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stride Lite">
<title>Stride Lite</title>
<style>
  :root{
    --ink:#2f3563; --soft:#7b81a8; --faint:#a9aec9;
    --card:#ffffff; --line:#eceef8;
    --warm:#f5a03c; --warm-deep:#e8801f;
    --cool:#6f79c9; --good:#35b785; --bad:#ef6b7d;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100dvh;
    background:linear-gradient(180deg,#f8f3ec 0%,#f3ece6 55%,#eeeaf3 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    display:flex;justify-content:center;
  }
  #app{width:100%;max-width:440px;padding:26px 20px 40px;display:flex;flex-direction:column;min-height:100dvh}

  .pill{
    align-self:flex-start;
    font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
    color:var(--soft);background:#fff;border-radius:100px;padding:7px 15px;
    box-shadow:0 2px 10px rgba(47,53,99,.06);
  }

  .scene{margin:18px 0 4px;border-radius:26px;overflow:hidden;background:#efe9f6;
         box-shadow:0 14px 34px rgba(47,53,99,.10)}
  .scene svg{display:block;width:100%;height:auto}
  #walker{transition:transform .9s cubic-bezier(.22,.9,.3,1)}

  .line{text-align:center;font-size:14px;color:var(--soft);margin:16px 0 4px}
  .line .up{color:var(--good);font-weight:700}
  .line .down{color:var(--bad);font-weight:700}

  .card{
    background:var(--card);border-radius:26px;padding:26px;
    box-shadow:0 14px 34px rgba(47,53,99,.09);
    margin-top:12px;
  }
  .time{font-size:64px;font-weight:200;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
  .move{font-size:16px;color:var(--soft);margin-top:8px}
  .hint{font-size:13px;color:var(--faint);margin-top:14px;line-height:1.6}

  .btn{
    width:100%;border:none;border-radius:100px;padding:19px;margin-top:20px;
    font-family:inherit;font-size:17px;font-weight:700;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,#f7ab52,var(--warm-deep));
    box-shadow:0 10px 22px rgba(232,128,31,.30);
    transition:transform .1s ease;
  }
  .btn:active{transform:scale(.975)}
  .btn:disabled{opacity:.55;pointer-events:none}
  .btn.ghost{background:#f4f5fb;color:var(--ink);box-shadow:none;font-size:15px;padding:15px;margin-top:10px}

  .done-card{text-align:center}
  .done-card .big{font-size:26px;font-weight:300;letter-spacing:-.02em;margin-bottom:6px}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="app">

  <div class="pill" id="pill">Day 1</div>

  <div class="scene" id="scene"></div>

  <div class="line" id="forecast"></div>

  <div class="card" id="card-todo">
    <div class="time" id="time">0:20</div>
    <div class="move" id="move">March in place</div>
    <button class="btn" id="btn-done">Done</button>
    <p class="hint" id="hint"></p>
  </div>

  <div class="card done-card hidden" id="card-done">
    <div class="big">You moved forward.</div>
    <p class="hint" id="done-hint"></p>
    <button class="btn ghost" id="btn-undo">Undo today</button>
  </div>

</div>

<script>
'use strict';

/* Stride Lite — one screen, one button, no music, no camera.
   The whole point: see your future self, take one step toward it. */

const DAYS = 90;
const START_SEC = 20;    // twenty seconds. that is the whole first day.
const END_SEC = 1200;    // twenty minutes by day ninety

const MOVES = ['March in place', 'Squats', 'Wall push-ups', 'Plank', 'Glute bridges'];
const key = 'stride.lite.v1';

let state = { startDate: null, history: [] };

function load() {
  try { const r = localStorage.getItem(key); if (r) state = { ...state, ...JSON.parse(r) }; } catch (e) {}
}
function save() { try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {} }

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');

function dayKey(offset) {
  const d = new Date();
  d.setDate(d.getDate() + (offset || 0));
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function daysSince() {
  if (!state.startDate) return 0;
  const s = new Date(state.startDate + 'T00:00:00');
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.max(0, Math.round((t - s) / 86400000));
}
const doneToday = () => state.history.includes(dayKey());

function compute() {
  const set = new Set(state.history);
  const ds = daysSince();
  let comp = 0, missed = 0;
  for (let i = 1; i <= ds; i++) (set.has(dayKey(-i)) ? comp++ : missed++);
  if (doneToday()) comp++;
  return { comp, missed, step: Math.max(0, Math.min(DAYS, comp - missed)), day: ds + 1 };
}

function secondsFor(day) {
  const d = Math.min(Math.max(day, 1), DAYS);
  return Math.round(START_SEC + (d - 1) * ((END_SEC - START_SEC) / (DAYS - 1)));
}
function fmt(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + pad(s % 60); }
function moveFor(day) {
  if (day <= 7) return MOVES[0];
  return MOVES[(day - 8) % (MOVES.length - 1) + 1];
}

/* ---------- the future self ---------- */
const W = 360, H = 240;
const clamp01 = (t) => Math.max(0, Math.min(1, t));

function sceneSVG(step) {
  const p = clamp01(step / DAYS);
  // you stand on the left, your future self waits ahead on the right
  const meX = 46 + p * 196;
  const glow = 0.35 + p * 0.65;
  const meBright = 0.45 + p * 0.55;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#e8e6f7"/>
      <stop offset="60%" stop-color="#f4e9e4"/>
      <stop offset="100%" stop-color="#fbe6cf"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffd79a" stop-opacity="${(0.85*glow).toFixed(2)}"/>
      <stop offset="100%" stop-color="#ffc478" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="${W}" height="${H}" fill="url(#sky)"/>

  <!-- horizon -->
  <path d="M0 ${H} L0 186 Q 90 172 180 184 T ${W} 176 L${W} ${H} Z" fill="#e2dcef" opacity="0.75"/>
  <path d="M0 ${H} L0 206 Q 110 194 220 206 T ${W} 200 L${W} ${H} Z" fill="#d8d2ea" opacity="0.8"/>

  <!-- the path between you and your future self -->
  <path d="M46 214 Q 150 202 242 208" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round"/>
  <path d="M46 214 Q 150 202 242 208" fill="none" stroke="#9aa0c4" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 7" stroke-linecap="round"/>

  <!-- future self: waiting, glowing -->
  <circle cx="252" cy="150" r="${(58*glow).toFixed(1)}" fill="url(#halo)"/>
  <g transform="translate(252 208)" opacity="${(0.55+0.45*p).toFixed(2)}">
    <ellipse cx="0" cy="4" rx="11" ry="3.2" fill="#c9a06a" opacity="0.30"/>
    <line x1="0" y1="-40" x2="0" y2="-6" stroke="#e08a2e" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-16" x2="-8" y2="0" stroke="#e08a2e" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-16" x2="8" y2="0" stroke="#e08a2e" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-34" x2="-11" y2="-22" stroke="#e08a2e" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-34" x2="11" y2="-22" stroke="#e08a2e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-48" r="9" fill="#e08a2e"/>
  </g>

  <!-- you, today -->
  <g id="walker" transform="translate(${meX.toFixed(1)} 0)">
    <g transform="translate(0 208)" opacity="${meBright.toFixed(2)}">
      <ellipse cx="0" cy="4" rx="10" ry="3" fill="#6f79c9" opacity="0.25"/>
      <line x1="0" y1="-34" x2="0" y2="-6" stroke="#4d5598" stroke-width="4.4" stroke-linecap="round"/>
      <line x1="0" y1="-14" x2="-7" y2="0" stroke="#4d5598" stroke-width="3.6" stroke-linecap="round"/>
      <line x1="0" y1="-14" x2="7" y2="0" stroke="#4d5598" stroke-width="3.6" stroke-linecap="round"/>
      <line x1="0" y1="-29" x2="-9" y2="-19" stroke="#4d5598" stroke-width="3.6" stroke-linecap="round"/>
      <line x1="0" y1="-29" x2="9" y2="-19" stroke="#4d5598" stroke-width="3.6" stroke-linecap="round"/>
      <circle cx="0" cy="-41" r="7.6" fill="#4d5598"/>
    </g>
  </g>
</svg>`;
}

/* ---------- render ---------- */
function render() {
  const c = compute();
  $('pill').textContent = 'Day ' + c.day;
  $('scene').innerHTML = sceneSVG(c.step);

  const up = Math.min(DAYS, c.step + 1);
  const down = Math.max(0, c.step - 1);
  $('forecast').innerHTML = doneToday()
    ? `Step ${c.step} of ${DAYS} &nbsp;·&nbsp; <span class="up">you moved forward today</span>`
    : `Do it → <span class="up">Step ${up}</span> &nbsp;·&nbsp; Skip → <span class="down">Step ${down}</span>`;

  const done = doneToday();
  $('card-todo').classList.toggle('hidden', done);
  $('card-done').classList.toggle('hidden', !done);

  if (!done) {
    const secs = secondsFor(c.day);
    $('time').textContent = fmt(secs);
    $('move').textContent = moveFor(c.day);
    $('hint').textContent = c.day === 1
      ? 'Twenty seconds. That is the whole job today.'
      : 'That is all. Tap Done when you have finished.';
  } else {
    $('done-hint').textContent = 'Your future self is one step closer. Come back tomorrow.';
  }
}

function markDone() {
  if (!state.startDate) state.startDate = dayKey();
  if (!doneToday()) state.history.push(dayKey());
  save();
  render();
}
function undo() {
  state.history = state.history.filter(d => d !== dayKey());
  save();
  render();
}

load();
$('btn-done').addEventListener('click', markDone);
$('btn-undo').addEventListener('click', undo);
render();
</script>
</body>
</html>
